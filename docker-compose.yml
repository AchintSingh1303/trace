# Demo:        docker compose up --build
# Real use:    copy .env.example to .env, set SECRET_KEY, ADMIN_EMAIL, ADMIN_PASSWORD and SEED_DEMO=0,
#              then docker compose up --build -d
services:
  trace:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Postgres instead of SQLite: set DATABASE_URL=postgresql+psycopg://user:pass@db:5432/trace
      # and add psycopg[binary] to requirements.txt.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////srv/trace/data/trace.db}
    volumes:
      - trace-data:/srv/trace/data
    restart: unless-stopped

volumes:
  trace-data:
